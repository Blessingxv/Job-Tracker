{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block main %}
<div class="auth-center">
    <form class="form-container" action="{{url_for('login')}}" method="post">
        <h5>Login</h5>
        <div class="mb-3">
            <input type="text" autofocus class="form-control w-auto" name="username" placeholder="Username">
        </div>
        <div class="mb-3" style="width: fit-content;" >
            <div class="input-group">
                <input class="form-control w-auto" type="password" id="password" name="password" placeholder="Password" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePassword" tabindex="-1">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                </button>
            </div>
        </div>
        <button class="btn btn-primary" type="submit">Login</button>
    </form>
</div>
    <script>
    document.getElementById('togglePassword').addEventListener('click', function () {
        const input = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    });
    </script>

{% endblock %}
